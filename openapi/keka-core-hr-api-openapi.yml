openapi: 3.2.0
info:
  title: Keka HR Core HR API
  description: REST API for the Keka HR and payroll platform covering employee records, attendance, leave, payroll, expense management, performance, recruitment, professional services automation, helpdesk, background verification, and rewards.
  version: v1
  contact:
    url: https://developers.keka.com/
  license:
    name: Keka Terms of Service
    url: https://www.keka.com/terms-of-service
servers:
- url: https://{tenant}.keka.com/api/v1
  description: Keka HR API
  variables:
    tenant:
      default: your-company
      description: Your Keka tenant subdomain
security:
- oauth2:
  - kekaapi
tags:
- name: Core HR
paths:
  /api/v1/hris/employees:
    get:
      operationId: get_all_employees
      summary: Get all employees
      tags:
      - Core HR
      responses:
        '200':
          description: Successful response
      description: 'This API is used for fetching details of all employees.


        Enumerated Values


        TimeType

        WorkerType

        MaritalStatus


        0 - None

        1 - FullTime

        2 - PartTime

        0 - None

        1 - Permanent

        2 - Contingent

        0 - None

        1- Single

        2 - Married

        3 - Widowed

        4 - Separated


        Gender

        EmploymentStatus

        AccountStatus


        0 - NotSpecified

        1 - Male

        2 - Female

        3 - Nonbinary

        4 - PreferNotToRespond

        0 - Working

        1- Relieved

        0 - NotRegistered

        1 - Registered

        2 - Disabled'
    post:
      operationId: create_employee
      summary: Create employee
      tags:
      - Core HR
      responses:
        '200':
          description: Successful response
      description: 'This API is used for creating a new Employee record.


        Enumerated Values


        TimeType

        WorkerType

        MaritalStatus


        0 - None

        1 - FullTime

        2 - PartTime

        0 - None

        1 - Permanent

        2 - Contingent

        0 - None

        1- Single

        2 - Married

        3 - Widowed

        4 - Separated


        Gender

        EmploymentStatus

        AccountStatus


        0 - NotSpecified

        1 - Male

        2 - Female

        3 - Nonbinary

        4 - PreferNotToRespond

        0 - Working

        1- Relieved

        0 - NotRegistered

        1 - Registered

        2 - Disabled


        <th'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                EmployeeNumber: '1234'
                DisplayName: Shubham Test
                FirstName: Shubham
                LastName: Test
                Email: shubhtest@test.com
                Gender: Male
                DateOfBirth: 09-08-1999
                DateJoined: 01-09-2021
                department: f5b7e125-d39c-4630-a332-6c97a265f953
                BusinessUnit: db76d978-8722-4e9a-9415-94f5bb523810
                JobTitle: f3f9425a-fdee-499d-8d1f-5966697e6125
                Location: 9fe494f8-dbf8-447e-9af0-c71370f4e94e
  /api/v1/hris/employees/8d04399f-8057-4b0d-ab0f-d9b9a5fb0376/personaldetails:
    put:
      operationId: update_employee_personal_details
      summary: Update Employee Personal Details
      tags:
      - Core HR
      responses:
        '200':
          description: Successful response
      description: Update Employee personal details
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                currentAddress:
                  addressLine1: 404, Brut Residence
                  addressLine2: Nr. Thomas Bakery
                  countryCode: IN
                  city: Manchester
                  state: North London
                  zip: M1 1AD
                displayName: Erling Haaland
                firstName: Erling
                lastName: Haaland
                gender: 0
                dateOfBirth: '1998-01-03T00:00:00'
                middleName: Brut
                workPhone: '9822134561'
                personalEmail: earling.haaland@yopmail.com
                maritalStatus: 0
                marriageDate: '2023-03-31T00:00:00'
                relations:
                - relationType: 2
                  gender: 1
                  firstName: Brut
                  lastName: Haaland
                  displayName: Brut Haaland
                  email: brut@yopmail.com
                  dateOfBirth: '1988-07-24T00:00:00'
                  profession: Footballer
                  mobile: '9999888864'
                bloodGroup: 8
  /api/v1/hris/employees/8d04399f-8057-4b0d-ab0f-d9b9a5fb0376/jobdetails:
    put:
      operationId: update_employee_job_details
      summary: Update Employee Job Details
      tags:
      - Core HR
      responses:
        '200':
          description: Successful response
      description: Update employee job details
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                location: d62a9b17-5973-4995-83fc-4952707b6d47
                jobTitle: 4a896b29-1935-4046-a6e4-eaef2aa7dfe1
                reportingManager: 7dd7e7ed-be39-47f3-beab-d498b940fd98
                attendanceNumber: KEKATTD12
                timeType: 0
  /api/v1/hris/employees/{id}:
    get:
      operationId: get_an_employee
      summary: Get an employee
      tags:
      - Core HR
      responses:
        '200':
          description: Successful response
      description: 'This API is used for fetching data of a specific employee by passing the employee ID as a URI parameter.


        Enumerated Values


        TimeType

        WorkerType

        MaritalStatus


        0 - None

        1 - FullTime

        2 - PartTime

        0 - None

        1 - Permanent

        2 - Contingent

        0 - None

        1- Single

        2 - Married

        3 - Widowed

        4 - Separated


        Gender

        EmploymentStatus

        AccountStatus


        0 - NotSpecified

        1 - Male

        2 - Female

        3 - Nonbinary

        4 - PreferNotToRespond

        0 - Working

        1- Relieved

        0 - NotRegistered

        1 - Registered

        2 - Disabled


        <div class="c'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
