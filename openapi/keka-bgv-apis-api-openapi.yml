openapi: 3.0.0
info:
  title: Keka HR Assets BGV APIs API
  description: REST API for the Keka HR and payroll platform covering employee records, attendance, leave, payroll, expense management, performance, recruitment, professional services automation, helpdesk, background verification, and rewards.
  version: v1
  contact:
    url: https://developers.keka.com/
  license:
    name: Keka Terms of Service
    url: https://www.keka.com/terms-of-service
servers:
- url: https://{tenant}.keka.com/api/v1
  description: Keka HR API
  variables:
    tenant:
      default: your-company
      description: Your Keka tenant subdomain
security:
- oauth2:
  - kekaapi
tags:
- name: BGV APIs
paths:
  /api/v1/hris/bgv/792a7e86-3cdc-4561-94c0-ba124df90acb/requests:
    get:
      operationId: get_all_bgv_requests
      summary: Get All BGV requests
      tags:
      - BGV APIs
      responses:
        '200':
          description: Successful response
  /api/v1/hris/bgv/{variable}/requests/{variable}:
    put:
      operationId: add_bgv_request_report
      summary: Add BGV request report
      tags:
      - BGV APIs
      responses:
        '200':
          description: Successful response
      parameters:
      - name: variable
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials flow
      flows:
        clientCredentials:
          tokenUrl: https://login.keka.com/connect/token
          scopes:
            kekaapi: Access to Keka HR API
